server:
  replicaCount: 1

  global:
    scrape_interval: 1m
    scrape_timeout: 10s
    evaluation_interval: 1m

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistentVolume:
    enabled: true
    size: 2Gi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

prometheus-pushgateway:
  enabled: false
